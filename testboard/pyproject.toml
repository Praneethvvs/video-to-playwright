[project]
name = "testboard"
version = "0.1.0"
description = "A control panel for a Playwright test repository: what exists, what passed, what drifted, and re-run any single test."
requires-python = ">=3.11"

# Deliberately small. This installs into its own virtualenv beside a test repo, never into the
# repo's own environment, so every dependency here is one the test suite never has to agree with.
# There is no Node, no bundler and no vendored JavaScript library: the browser's native EventSource
# covers live log streaming, including Last-Event-ID replay on reconnect.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",   # FastAPI needs it to read HTML form posts
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "psutil>=5.9",
    # Corporate TLS interception (Zscaler and friends) re-signs traffic with a root that lives in
    # the OS trust store. httpx uses certifi's bundle instead and fails to verify, which the
    # preflight would otherwise report as "the host is unreachable" when it is perfectly fine.
    "truststore>=0.9",
]

[project.optional-dependencies]
# Turning a recording into tests. Optional because it is the one feature that needs a credential
# and a large dependency (the SDK bundles a pinned Codex binary), and everything else — the test
# list, running, drift, the map — works without it. Absent, generation reports itself unavailable
# with the reason, rather than failing when somebody presses the button.
codex = ["openai-codex>=0.155"]

[project.scripts]
testboard = "testboard.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["testboard*"]

[tool.setuptools.package-data]
# static/* does not match nested files, and a missing woff2 degrades silently to a fallback font
# rather than erroring — so the fonts directory is listed explicitly.
testboard = ["templates/*.html", "static/*.css", "static/*.js", "static/fonts/*.woff2"]
