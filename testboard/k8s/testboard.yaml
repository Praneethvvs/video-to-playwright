# testboard in Kubernetes, beside the application under test.
#
# NOT APPLIED. This has never been deployed; it is written now so that deploying later is a review
# and an `kubectl apply`, not a design exercise. Read every comment marked DECIDE before using it.
#
# The reason to run it in the cluster at all is network reachability: an environment that is only
# addressable from inside cannot be tested from a laptop. If the dev deployment is reachable over
# the VPN, running testboard locally is simpler and has fewer moving parts.

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: testboard-state
spec:
  # Run history and artifacts live here. Without a volume, every pod reschedule silently resets
  # the history to empty — which looks exactly like "nobody has run anything", and is the sort of
  # thing that gets discovered months later.
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi          # must exceed artifacts.total_cap_mb in testboard.yaml, with headroom

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testboard
  labels: {app: testboard}
spec:
  # Exactly one. Two replicas means two independent run queues against one shared environment,
  # and the "only one test at a time" guarantee — which exists because the suite mutates shared
  # data — silently stops holding.
  replicas: 1
  strategy:
    type: Recreate           # never two pods at once, not even briefly during a rollout
  selector:
    matchLabels: {app: testboard}
  template:
    metadata:
      labels: {app: testboard}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        # The repository under test is cloned at start rather than baked into the image, so the
        # image stays generic across every test repo.
        - name: clone
          image: alpine/git:latest
          args:
            - clone
            - --depth=1
            - $(REPO_URL)
            - /repo
          env:
            - name: REPO_URL
              value: "https://dev.azure.com/<org>/<project>/_git/<test-repo>"   # DECIDE
          volumeMounts:
            - {name: repo, mountPath: /repo}
        - name: prepare-venv
          image: testboard:0.1.0            # DECIDE: your registry path
          command: ["sh", "-c"]
          args:
            - |
              set -e
              python -m venv /repo/venv
              /repo/venv/bin/python -m pip install --quiet -e /repo 2>/dev/null || \
              /repo/venv/bin/python -m pip install --quiet pytest-playwright
          volumeMounts:
            - {name: repo, mountPath: /repo}
      containers:
        - name: testboard
          image: testboard:0.1.0            # DECIDE: your registry path
          args: ["python", "-m", "testboard", "--repo", "/repo", "--host", "0.0.0.0"]
          ports:
            - {containerPort: 8770, name: http}
          env:
            # The name of this variable comes from the repo's testboard.yaml; the value belongs
            # here. In-cluster, point it at the service, not the public hostname.
            - name: ORCA_BASE_URL
              value: "http://orca-complex-properties-ui.<namespace>.svc.cluster.local"  # DECIDE
            # The credential for turning recordings into tests. This is the whole reason the
            # agent runs in-process through the SDK rather than as `codex exec`: the CLI wants an
            # interactive login or a seeded ~/.codex/auth.json, and neither belongs in an image.
            # login_api_key() reads this at startup and nothing is written to disk.
            - name: CODEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: testboard-codex          # kubectl create secret generic testboard-codex \
                  key: api-key                   #   --from-literal=api-key=sk-...
                  optional: true                 # absent = generation reports itself unavailable
            # REQUIRED, and enforced: testboard refuses to start on a non-loopback address
            # without it. It can start runs that change data in a shared environment and has no
            # login of its own, so a warning would not be good enough.
            #   python -c "import secrets;print(secrets.token_urlsafe(32))"
            - name: TESTBOARD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: testboard-codex
                  key: dashboard-token
            # Uncomment with the volume below if the cluster sits behind TLS interception.
            # - name: SSL_CERT_FILE
            #   value: /etc/ssl/corporate/ca-bundle.pem
          resources:
            # A browser is memory-hungry and bursty. Too low a limit shows up as tests that fail
            # only in the cluster, which is an expensive thing to debug.
            requests: {cpu: "500m", memory: "1Gi"}
            limits:   {cpu: "2",    memory: "4Gi"}
          volumeMounts:
            - {name: repo,  mountPath: /repo}
            - {name: state, mountPath: /repo/.testboard}
            - {name: shm,   mountPath: /dev/shm}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
            # Generous: a liveness restart during a run loses that run. The executor reconciles
            # it to "crashed" on the way back up, but a flapping probe would do that repeatedly.
            failureThreshold: 6
      volumes:
        - {name: repo,  emptyDir: {}}
        - {name: state, persistentVolumeClaim: {claimName: testboard-state}}
        # Chromium crashes with the default 64 MB /dev/shm. This is the single most common cause
        # of "the browser works locally and dies in the cluster".
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 1Gi}}

---
apiVersion: v1
kind: Service
metadata:
  name: testboard
spec:
  selector: {app: testboard}
  ports:
    - {port: 80, targetPort: http, name: http}

# ---------------------------------------------------------------------------------------------
# No Ingress is included on purpose — decide how this is reached before exposing it.
#
# The container above is authenticated by TESTBOARD_TOKEN, and testboard will not start on a
# non-loopback address without one. That stops anything on the cluster network pressing its
# buttons. It is not the same as knowing who pressed them: every token holder is recorded
# identically, as `token@<address>`.
#
# For a real audit trail — the whole point of recording who approved a test — put an
# authenticating proxy in front and have it set X-Forwarded-User. testboard prefers that header
# over the token identity, validates it, and records the name against approvals and runs.
#
# Simplest safe start, needing no ingress at all:
#     kubectl port-forward svc/testboard 8770:80
#
# The pipeline posts its JUnit report to /api/runs/junit with the same token. That is what makes
# a run executed here appear on the dashboard instead of "never run from here".
